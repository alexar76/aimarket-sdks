[package]
name = "aimarket-agent"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "AI Market Protocol v2 consumer SDK for Rust — Tauri desktop apps, CLI tools"
repository = "https://github.com/alexar76/aimarket-sdks"
homepage = "https://github.com/alexar76/aimarket-sdks/tree/main/rust"
license = "MIT"
readme = "README.md"
keywords = ["ai", "marketplace", "ed25519", "eip712", "web3"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.14", features = ["ecdsa"] }
ecdsa = { version = "0.17", features = ["algorithm"] }
# Security floor for K256 arithmetic (RUSTSEC-2026-0387).
crypto-bigint = { version = "0.7.6", default-features = false }
tiny-keccak = { version = "2", features = ["keccak"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
